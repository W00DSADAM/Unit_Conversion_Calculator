<!DOCTYPE html>
  <html>
  <head>
  <title>Unit Conversion Calculator</title>
  </head>
  <body>
    <h1>Unit Conversion Calculator</h1>
    <h2>Solar Radiation </h2>
    <p><input id="kw" type="number" oninput="fromKw()"> kW/m2</p>
    <p><input id="w" type="number" oninput="fromW()"> W/m2</p>
    <h2>Flow</h2>
    <p><input id="cc" type="number" oninput="fromCc()"> cc/min</p>
    <p><input id="lpm" type="number" oninput="fromLpm()"> LPM</p>
    <h2>Pressure</h2>
    <p><input id="mmhg" type="number" oninput="fromPressure('mmhg')"> mmHg</p>
    <p><input id="mbar" type="number" oninput="fromPressure('mbar')"> mbar</p>
    <p><input id="psia" type="number" oninput="fromPressure('psia')"> psia</p>
    <h2>Wind Speed</h2>
    <p><input id="ms" type="number" oninput="fromWind('ms')"> m/s</p>
    <p><input id="mph" type="number" oninput="fromWind('mph')"> mph</p>
    <p><input id="knots" type="number" oninput="fromWind('knots')"> knots</p>
    <p><input id="kmh" type="number" oninput="fromWind('kmh')"> km/h</p>
 <script>
   // How many mbar are in 1 of each unit
   var mbarPer = {
     mmhg: 1013.25 / 760,
     mbar: 1,
     psia: 68.94757293
   };
   //Convert any pressure box to all the others
   function fromPressure(unit) {
     var text = document.getElementById(unit).value;
     for (var other in mbarPer) {
       if (other != unit) {
         if (text == "") {
           document.getElementById(other).value = "";
         } else {
           var mbar = parseFloat(text) *mbarPer[unit];
           document.getElementById(other).value = clean(mbar / mbarPer[other]);
         }
       }
     }
   }   
   // Clean up tiny computer math errors (keeps up to 6 decimals)
   function clean(n) {
     return parseFloat(n.toFixed(6));
   }
  // kW/m2 to W/m2
  function fromKw() {
     var text = document.getElementById("kw").value;
     if (text == "") {
      document.getElementById("w").value = "";
     } else {
       document.getElementById("w").value = clean(parseFloat(text) * 1000);
     }
  }

  // W/m2 to KW/m2
  function fromW() {
    var text = document.getElementById("w").value;
    if (text == "") {
      document.getElementById("kw").value = "";
    } else {
        document.getElementById("kw").value = clean(parseFloat(text) / 1000);
    }
  }
   // cc/min to LPM
   function fromCc() {
   var text = document.getElementById("cc").value;
   if (text == "") {
     document.getElementById("lpm").value = "";
   } else {
     document.getElementById("lpm").value = clean(parseFloat(text) / 1000);
   }
  }
  //LPM to cc/min
   function fromLpm() {
     var text = document.getElementById("lpm").value;
     if (text == "") {
       document.getElementById("cc").value = ""; 
     } else {
       document.getElementById("cc").value = clean(parseFloat(text) * 1000);
     }
   }
   // How many m/s are in 1 of each unit
   var msPer = {
     ms: 1,
     mph: 0.44704,
     knots: 1852/3600,
     kmh: 1000/3600
   };
   //Convert any wind speed box to all the others
   function fromWind(unit) {
     var text = document.getElementById(unit).value;
     for (var other in msPer)
       if (other != unit) {
         if (text == "") {
           document.getElementById(other).value = "";
         } else {
           var ms = parseFloat(text) * msPer[unit];
           document.getElementById(other).value = clean(ms / msPer[other]);
         }
       }
     }
   }
</script>
</body>
</html>
