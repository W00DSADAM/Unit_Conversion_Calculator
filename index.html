<!DOCTYPE html>
  <html>
  <head>
  <title>Unit Conversion Calculator</title>
  </head>
  <body>
    <h1>Unit Conversion Calculator</h1>
    <h2>Solar Radiation </h2>
    <p><input id="kw" type="number" oninput="fromKw()"> kW/m2</p>
    <p><input id="w" type="number" oninput="fromW()"> W/m2</p>
    <h2>Flow</h2>
    <p><input id="cc" type="number" oninput="fromCc()"> cc/min</p>
    <p><input id="lpm" type="number" oninput="fromLpm()"> LPM</p>
 <script>
   // Clean up tiny computer math errors (keeps up to 6 decimals)
   function clean(n) {
     return parseFlost(n.toFixed(6));
   }
  // kW/m2 to W/m2
  function fromKw() {
     var text = document.getElementById("kw").value;
     if (text == "") {
      document.getElementById("w").value = "";
     } else {
       document.getElementById("w").value = clean(parseFloat(text) * 1000);
     }
  }

  // W/m2 to KW/m2
  function fromW() {
    var text = document.getElementById("w").value;
    if (text = "") {
      document.getElementById("kw").value = "";
    } else {
        document.getElementById("kw").value = clean(parseFloat(text) / 1000);
    }
  }
   // cc/min to LPM
   function fromCc() {
   var text = document.getElementById("cc").value;
   if (text == "") {
     document.getElementById("lpm).value = "";
   } else {
     document.getElementById("lpm").value = clean(parseFlost(text) / 1000);
   }
  }
  //LPM to cc/min
   function fromLpm() {
     var text = document.getElementById("lpm").value;
     if (text == "") {
       document.getElementById("cc").value = ""; 
     } else {
       document.getElementById("cc").value = clean(parseFloat(text) * 1000);
     }
   }
</script>
</body>
</html>
